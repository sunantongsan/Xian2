<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#142b32"><link rel="icon" href="data:,"><title>COCKRO • กำเนิดฮีโร่แมลง</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="gift-center.css"><link rel="stylesheet" href="coin-celebration.css"></head><body>
