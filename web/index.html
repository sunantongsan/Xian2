<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#142b32"><link rel="icon" href="data:,"><title>COCKRO • กำเนิดฮีโร่แมลง</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="gift-center.css"><link rel="stylesheet" href="coin-celebration.css"><link rel="stylesheet" href="mobile-layout.css"></head><body>
<canvas id="game" aria-label="พื้นที่เกม"></canvas>

small>วิชา</small></button><button id="exitShortcut"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v9"/><path d="M7.3 5.5a8.5 8.5 0 1 0 9.4 0"/></svg><small>ออกเกม</small></button><button id="logoutShortcut"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3H5v18h5M10 12h11m-4-4 4 4-4 4"/></svg><small>ออกจากบัญชี</small></button></nav><div id="zoomControls" hidden><button id="zoomOut" aria-label="ซูมออก">−</button><button id="zoomIn" aria-label="ซูมเข้า">+</button></div></div></div><button id="chatToggle" aria-label="เปิดแชทในเกม"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 4V5a2 2 0 0 1 2-2Z"/><path d="M7 8h10M7 12h6"/></svg><span>แชท</span><b id="chatUnread" hidden></b></button><div class="buff-readout"><small id="expBoostStatus" hidden></small><small id="townBuffStatus" hidden title="บัฟหุ่นยนต์ AURA-01"></small></div><div id="pickupFeed" aria-live="polite"></div><div id="fieldActions"><button id="townBtn" aria-label="กลับเมือง"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M6 10v11h12V10M10 21v-7h4v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><small>กลับเมือง</small></button></div></header>
