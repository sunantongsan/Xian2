<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b32"><link rel="icon" href="data:,"><title>COCKRO • กำเนิดฮีโร่แมลง</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game" aria-label="พื้นที่เกม"></canvas>
<div id="loading"><h1>COCKRO</h1><p>กำเนิดฮีโร่แมลง</p><progress id="progress" max="11" value="0"></progress><p id="loadText">กำลังเตรียมดาวออโรรา…</p><button id="retry" hidden>ลองอีกครั้ง</button></div>
<header id="hud" hidden><div class="panel player-panel" id="characterShortcut" role="button" tabindex="0" aria-label="จัดการตัวละคร"><div id="portrait" aria-hidden="true"></div><b id="heroName"></b><span id="level"></span><div class="meter"><i id="hp"></i></div><small id="hpText"></small><div class="meter mana"><i id="mp"></i></div><small id="mpText"></small><small id="townBuffStatus" hidden title="บัฟหุ่นยนต์ AURA-01"></small><div class="meter xp"><i id="xp"></i></div><small id="xpText">EXP</small></div><div class="panel right"><b id="zoneName"></b><span id="money"></span><button id="shopShortcut" class="direct-shortcut" aria-label="ร้านค้า"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 5h4l4 16h14l4-12H9" fill="#a47c31" stroke="#ffe3a1" stroke-width="2" stroke-linejoin="round"/><path d="M12 13h14M13 17h12" stroke="#ffe3a1" stroke-width="1.5"/><circle cx="13" cy="26" r="2.5" fill="#ffe3a1"/><circle cx="24" cy="26" r="2.5" fill="#ffe3a1"/></svg><small>ร้านค้า</small></button><button id="checkinShortcut" class="direct-shortcut" aria-label="เช็กอินรับทอง"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="7" width="23" height="22" rx="4" fill="#142e46" stroke="#ffe3a1" stroke-width="2"/><path d="M5 13h23M11 4v7M22 4v7" stroke="#ffe3a1" stroke-width="2.5" stroke-linecap="round"/><path d="m11 21 4 4 8-8" fill="none" stroke="#8cf0af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><small>เช็กอิน</small></button><button id="quickMenuToggle" aria-label="เปิดเมนูทางลัด" aria-expanded="false" aria-controls="quickMenuTray">☰</button><div id="quickMenuTray" inert><nav class="quick-menu"><button id="mapShortcut"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16"/></svg><small>แผนที่</small></button><button id="statsShortcut">♙<small>สถานะ</small></button><button id="skillsShortcut">✧<small>วิชา</small></button><button id="bagShortcut">◇<small>กระเป๋า</small></button><button id="menuBtn">☰<small>เมนู</small></button></nav><div id="zoomControls" hidden><button id="zoomOut" aria-label="ซูมออก">−</button><button id="zoomIn" aria-label="ซูมเข้า">+</button></div></div></div></header>
<div id="hint" hidden>ลากจอยเพื่อเดิน • แตะศัตรูเพื่อล็อกเป้า</div><div id="toast" role="status"></div>
<div id="controls" hidden><div class="movement"><button id="autoBtn" aria-pressed="false">ออโต้: ปิด</button><button id="townBtn">⌂ กลับฐาน</button><div id="joystick" role="group" aria-label="จอยเดิน"><span class="joy-ring"></span><span id="joystickThumb"></span></div></div><div class="combat"><button id="potionBtn">HP</button><button id="mpPotionBtn" aria-label="ใช้ยา MP">MP</button><button id="dashBtn">หลบ</button><button id="skillBtn">วิชา 1</button><button id="skillBtn1">วิชา 2</button><button id="skillBtn2">วิชา 3</button><button id="skillBtn3">วิชา 4</button><button id="skillBtn4">วิชา 5</button><button id="attackBtn" aria-label="โจมตี"><span>⚔</span>โจมตี</button></div></div>
<dialog id="modal"><button id="windowClose" aria-label="ปิดหน้าต่าง" hidden>×</button><div id="modalContent"></div></dialog>
<script type="module" src="game.js"></script></body></html>
