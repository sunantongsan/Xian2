<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b32"><title>วิถีเชียน</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game" aria-label="พื้นที่เกม"></canvas>
<div id="loading"><h1>วิถีเชียน</h1><p>วิถีเชียน</p><progress id="progress" max="11" value="0"></progress><p id="loadText">กำลังเตรียมสำนัก…</p><button id="retry" hidden>ลองอีกครั้ง</button></div>
<header id="hud" hidden><div class="panel player-panel"><div id="portrait" aria-hidden="true"></div><b id="heroName"></b><span id="level"></span><div class="meter"><i id="hp"></i></div><small id="hpText"></small><div class="meter mana"><i id="mp"></i></div><small id="mpText"></small><div class="meter xp"><i id="xp"></i></div></div><div class="panel right"><b id="zoneName"></b><span id="money"></span><nav class="quick-menu"><button id="mapShortcut"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16"/></svg><small>แผนที่</small></button><button id="statsShortcut">♙<small>สถานะ</small></button><button id="skillsShortcut">✧<small>วิชา</small></button><button id="bagShortcut">◇<small>จัดการ</small></button><button id="menuBtn">☰<small>เมนู</small></button></nav><div id="zoomControls" hidden><button id="zoomOut" aria-label="ซูมออก">−</button><button id="zoomIn" aria-label="ซูมเข้า">+</button></div></div></header>
<div id="hint" hidden>ลากจอยเพื่อเดิน • แตะศัตรูเพื่อล็อกเป้า</div><div id="toast" role="status"></div>
<div id="controls" hidden><div class="movement"><button id="autoBtn" aria-pressed="false">ออโต้: ปิด</button><button id="townBtn">⌂ กลับเมือง</button><div id="joystick" role="group" aria-label="จอยเดิน"><span class="joy-ring"></span><span id="joystickThumb"></span></div></div><div class="combat"><button id="potionBtn">ยา</button><button id="dashBtn">หลบ</button><button id="skillBtn">วิชา 1</button><button id="skillBtn1">วิชา 2</button><button id="skillBtn2">วิชา 3</button><button id="attackBtn" aria-label="โจมตี"><span>⚔</span>โจมตี</button></div></div>
<dialog id="modal"><button id="windowClose" aria-label="ปิดหน้าต่าง" hidden>×</button><div id="modalContent"></div></dialog>
<script type="module" src="game.js"></script></body></html>
