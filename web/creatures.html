<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>มอนสเตอร์ดาวฮีโร่ • COCKRO</title><style>
@font-face{font-family:Thai;src:url(assets/NotoSansThai.ttf)}*{box-sizing:border-box}body{margin:0;background:#0a1722;color:#e8f3f4;font:16px Thai,sans-serif}header{padding:30px 5vw;border-bottom:1px solid #34505c;background:linear-gradient(120deg,#162d35,#192039)}header p{color:#a9c4c8}h1{margin:6px 0;font-size:30px}a{color:#bcecc8}main{padding:24px 5vw;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}article{background:radial-gradient(ellipse at 50% 40%,#274551,#14232e 72%);border:1px solid #365361;border-radius:14px;overflow:hidden;text-align:center;padding:12px 8px 16px}canvas{width:100%;height:150px;object-fit:contain}h2{font-size:15px;margin:4px 0 8px}small{color:#b8d1d3}b{font-size:13px;color:#e7d59a;display:block}footer{padding:0 5vw 32px;color:#afc7ce}@media(max-width:900px){main{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){main{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
</style><header><a href="./">← กลับเกม COCKRO</a><h1>สิ่งมีชีวิตแห่งดาวฮีโร่</h1><p>20 สายพันธุ์ใหม่ • เลเวล 61–120 • 12 เขตสำรวจ</p></header><main id="cards"></main><footer>ป่าชีวะแสง: Lv.1–60 · ดาวฮีโร่: Lv.61–120 · บอสประจำช่วงเลเวล 70 / 80 / 90 / 100 / 110 / 120</footer><script type="module">
import {ADVANCED_SPECIES,advancedMonster} from './advanced-monsters.js';import {drawAdvancedMonster} from './monster-render.js';
const types={melee:'โจมตีประชิด',dash:'พุ่งเข้าประชิด',projectile:'ยิงระยะไกล',cone:'โจมตีเป็นกรวย',burst:'ระเบิดรอบตัว'};const cards=document.getElementById('cards');
const actors=ADVANCED_SPECIES.map(sp=>{const el=document.createElement('article');el.innerHTML=`<canvas width="260" height="180" aria-label="${sp.name}"></canvas><h2>${sp.name}</h2><b>Lv.${sp.min}–${sp.max}</b><small>${types[sp.attack]}</small>`;cards.append(el);return {g:el.querySelector('canvas').getContext('2d'),e:{def:advancedMonster(sp.min),hp:1,face:1,moving:true,state:'idle',walkDistance:0}};});
function frame(t){for(const a of actors){a.g.clearRect(0,0,260,180);a.g.fillStyle='#07131c80';a.g.beginPath();a.g.ellipse(130,166,38,9,0,0,7);a.g.fill();a.e.walkDistance=t*.03;drawAdvancedMonster(a.g,a.e,130,166,135,t/1000);}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
