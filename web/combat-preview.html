<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COCKRO • Arsenal 4.21</title><style>@font-face{font-family:GameThai;src:url(fonts/NotoSansThai.ttf)}*{box-sizing:border-box}body{margin:0;background:#07111d;color:#e4f4ff;font:16px GameThai,sans-serif;padding:24px}h1{margin:0;font-size:26px}p{color:#91adbe}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{background:#132d40;border:1px solid #32546a;color:#e4f4ff;padding:10px;border-radius:8px}button[aria-pressed=true]{border-color:#69ddff;background:#16455a}.layout{display:grid;grid-template-columns:280px 1fr;gap:24px}.weapon{width:256px;height:256px;background:url(items/class-weapons.webp) no-repeat;background-size:200% 200%;border-radius:12px}.skills{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.skill{aspect-ratio:1;background:url(ui/scifi-skills.webp);background-size:600% 400%;border-radius:10px;border:1px solid #315367}canvas{width:100%;aspect-ratio:2;background:radial-gradient(ellipse at center,#183444,#09131f);border:1px solid #315367;border-radius:12px}.caption{font-size:14px} @media(max-width:700px){.layout{grid-template-columns:1fr}.weapon{width:180px;height:180px}}</style><h1>COCKRO • อาวุธแห่งโลกอนาคต</h1><p>4.21.0 • อาวุธเฉพาะอาชีพและเอฟเฟกต์การต่อสู้</p><nav id="classes"></nav><div class="layout"><section><div class="weapon" id="weapon"></div><h2 id="name"></h2><p id="description"></p></section><section><div class="skills" id="skills"></div><nav><label>รูปแบบ <select id="form"><option value="bolt">ยิงระยะไกล</option><option value="wave">คลื่นพลัง</option><option value="circle">พัลส์รอบตัว</option><option value="field">สนามพลัง</option><option value="dash">เจ็ตบูสต์</option></select></label><label>คุณภาพ <select id="quality"><option value="auto">ปกติ</option><option value="low">ประหยัด</option></select></label></nav><canvas id="preview" width="900" height="450"></canvas><p class="caption">ใช้ตัววาดเอฟเฟกต์เดียวกับเกม • ภาพเคลื่อนไหววนซ้ำ</p></section></div><script type="module">
import {HERO_CLASSES} from './hero-ui.js';import {drawCombatEffect} from './combat-vfx.js';import {knownSkills} from './skills.js';
const $=id=>document.getElementById(id),g=$('preview').getContext('2d');let hero=HERO_CLASSES[2].id;
function select(i){hero=HERO_CLASSES[i].id;$('weapon').style.backgroundPosition=`${i%2*100}% ${Math.floor(i/2)*100}%`;$('name').textContent=HERO_CLASSES[i].name;$('description').textContent=HERO_CLASSES[i].description;$('classes').querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));$('skills').innerHTML=knownSkills({hero,recipes:[]}).slice(0,6).map((s,n)=>`<div class="skill" role="img" aria-label="${s.name}" title="${s.name}" style="background-position:${n/5*100}% ${i/3*100}%"></div>`).join('');}
HERO_CLASSES.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h.name;b.onclick=()=>select(i);$('classes').appendChild(b);});select(2);
function frame(now){g.clearRect(0,0,900,450);g.strokeStyle='#264757';g.lineWidth=1;for(let i=0;i<900;i+=60){g.beginPath();g.moveTo(i,0);g.lineTo(i,450);g.stroke();}for(let i=0;i<450;i+=45){g.beginPath();g.moveTo(0,i);g.lineTo(900,i);g.stroke();}const t=(now%1600)/1600;const project=(x,y)=>({x:220+x,y:260+y*.4});g.fillStyle='#81d7ed';g.fillRect(207,215,26,45);g.fillStyle='#b78798';g.fillRect(637,210,32,50);drawCombatEffect(g,{hero,form:$('form').value,x:0,y:0,aim:{x:430,y:0},radius:150,range:430,life:1-t,max:1},project,1,$('quality').value);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
