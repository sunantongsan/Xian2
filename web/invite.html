<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COCKRO MAN · ชวนเพื่อน</title>
<style>body{font:18px system-ui;background:#172029;color:#faf4e7;max-width:28rem;margin:12vh auto;padding:1.5rem}a,button{display:block;padding:.65rem;margin:.7rem 0;color:#172029;background:#f9d389;border-radius:.35rem;text-align:center}[hidden]{display:none}strong{letter-spacing:.1em;user-select:all}p{line-height:1.6}</style>
<main><h1>COCKRO MAN</h1><p id="description"></p><strong id="code"></strong><a id="open" hidden>เปิดเกม / Open game</a><a id="install">ติดตั้งจาก Google Play / Install</a></main>
<script type="module">
import {normalizeInviteCode} from './invite-rules.js';
const code=normalizeInviteCode(new URL(location.href).searchParams.get('ref'));
const desc=document.getElementById('description'),open=document.getElementById('open'),install=document.getElementById('install');
const store=new URL('https://play.google.com/store/apps/details');
store.searchParams.set('id','com.sunantongsan.networkcokcro');
if(code){
 document.getElementById('code').textContent=code;
 desc.textContent=navigator.language.startsWith('th')?'สมัครด้วยรหัสนี้เพื่อรับ 5,000,000 Cockro หากรหัสไม่ขึ้น ให้กรอกตอนสร้างตัวละคร':'Use this code when creating your first character for 5,000,000 Cockro. Enter it manually if needed.';
 open.hidden=false;open.href='cockronetwork://invite?ref='+code;
 store.searchParams.set('referrer','ref='+code);
}else{desc.textContent='ลิงก์ไม่มีรหัสแนะนำ / Missing invite code';open.remove();}
install.href=store.href;
</script></html>
