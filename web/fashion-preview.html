<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ห้องลองชุด • COCKRO</title><style>@font-face{font-family:Thai;src:url(assets/NotoSansThai.ttf)}*{box-sizing:border-box}body{margin:0;background:#0b1925;color:#efe8d8;font:15px Thai,sans-serif}header{padding:24px 4vw;border-bottom:1px solid #5e604e;background:linear-gradient(110deg,#183944,#171d30)}h1{margin:8px 0;color:#e8d297}a{color:#b7e6d4}label{margin-right:18px}select,button{font:inherit;padding:8px;background:#16303d;color:#f4e6c5;border:1px solid #65808b;border-radius:8px}main{padding:20px 4vw;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}article{background:radial-gradient(ellipse at 50% 65%,#304e54,#122532 70%);border:1px solid #5a6a6c;border-radius:15px;text-align:center;padding:12px}canvas{width:100%;height:300px;object-fit:contain}h2{font-size:16px;margin:5px}small{color:#b8c8ca}#status{color:#d8be89}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){canvas{height:230px}}</style><header><a href="./">← กลับเกม</a><h1>ห้องลองชุดฮีโร่</h1><p>คาวบอยพเนจร · จอมยุทธเมฆาหยก · อัศวินดวงดาว — สวมได้ทุกอาชีพ</p><label>ท่าทาง <select id="pose"><option value="idle">ยืน</option><option value="walk">เดิน</option><option value="attack">โจมตี</option><option value="skill">ใช้วิชา</option><option value="back">ด้านหลัง</option></select></label><label><input id="wear" type="checkbox" checked>สวมหมวกและชุด</label><p id="status">กำลังโหลดห้องลองชุด…</p></header><main id="gallery"></main><script type="module">
import {FASHION_SETS} from './fashion.js';import {drawHero} from './hero-animation.js';
const heroes=[['sword-cockro','แมงสาบแมน'],['demon-scorpion','แมงป่องแมน'],['sword-dragonfly','แมลงปอเกิล'],['sword-cricket','จิ้งหรีดแมน']];const images=new Map();const files=[...FASHION_SETS.map(s=>s.file),'heroes/cockro-combat-v2.webp',...heroes.slice(1).map(h=>'heroes/'+h[0]+'.webp')];
try{await Promise.all(files.map(file=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{images.set(file,i);ok()};i.onerror=no;i.src=file})));document.getElementById('status').textContent='พร้อมลองชุด • ภาพเดียวกับที่ใช้ในเกม';}catch{document.getElementById('status').textContent='โหลดภาพไม่สำเร็จ กรุณาเปิดใหม่';}
const actors=[];for(const set of FASHION_SETS)for(const [hero,name]of heroes){const a=document.createElement('article');a.innerHTML=`<h2>${set.name}</h2><canvas width="360" height="400" aria-label="${name}สวม${set.name}"></canvas><small>${name}</small>`;document.getElementById('gallery').append(a);actors.push({g:a.querySelector('canvas').getContext('2d'),hero,set:set.id});}
function frame(ms){const t=ms/1000,pose=document.getElementById('pose').value;for(const a of actors){const g=a.g;g.clearRect(0,0,360,400);g.fillStyle='#08141e99';g.beginPath();g.ellipse(180,365,72,17,0,0,7);g.fill();drawHero(g,images,a.hero,{face:1,anim:pose==='back'?'walk':pose,animTime:t%.8,animDuration:.8,walkDistance:t*75,back:pose==='back',appearance:document.getElementById('wear').checked?{hat:a.set+'-hat',outfit:a.set+'-outfit'}:{}},180,360,280);}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
