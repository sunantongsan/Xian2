<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>COCKRO • Living Forest 4.22</title><style>@font-face{font-family:Thai;src:url(fonts/NotoSansThai.ttf)}*{box-sizing:border-box}body{margin:0;background:#08141c;color:#e8f8ff;font:16px Thai,sans-serif;padding:32px}header{max-width:1100px;margin:auto}h1{font-size:32px;margin:0}p{color:#9fb8c5}a{color:#76e8ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;max-width:1400px;margin:28px auto}.card{background:linear-gradient(#122b36,#0b1d27);border:1px solid #294650;border-radius:14px;overflow:hidden}.card canvas{width:100%;aspect-ratio:1.2}.text{padding:0 16px 16px}.text h2{font-size:17px;margin:0}.text p{font-size:13px;margin:7px 0}.level{color:#e2c688;font-size:12px}button{font:inherit;color:#c6f5ff;background:#173540;border:1px solid #467180;border-radius:7px;padding:8px 14px}</style><header><p>COCKRO • 4.22.0</p><h1>ป่าที่มีชีวิต</h1><p>มอนสเตอร์ใหม่ 20 ชนิด • เลเวล 1–60 • ดูท่าโจมตีและพื้นที่อันตรายของแต่ละชนิด</p><button id="pause">หยุดภาพเคลื่อนไหว</button> <a href="combat-preview.html">ดูเอฟเฟกต์อาชีพ</a></header><div class="grid" id="grid"></div><script type="module">
import {FOREST_SPECIES,forestMonster,monsterZones,drawMonsterZones} from './forest-species.js';import {drawForestMonster,drawMonsterAttack} from './forest-render.js';
const im=new Image();im.src='sprites/forest-bestiary.webp';await im.decode();const texture=new Image();texture.src='vfx/plasma.webp';await texture.decode();const detail=new Image();detail.src='sprites/forest-apex.webp';await detail.decode();let paused=false;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'เล่นภาพเคลื่อนไหว':'หยุดภาพเคลื่อนไหว';};
const cards=FOREST_SPECIES.map(sp=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<canvas width="400" height="330"></canvas><div class="text"><span class="level">Lv. ${sp.min}–${sp.max}</span><h2>${sp.name}</h2><p>${sp.skillName}</p></div>`;document.querySelector('#grid').append(card);return{g:card.querySelector('canvas').getContext('2d'),e:{def:forestMonster(sp.min),x:0,y:0,hp:100,face:1,angle:0,aimX:180,aimY:0}};});
let time=0,last=0;function frame(now){if(!paused)time+=Math.min(.05,(now-last)/1000||0);last=now;for(const {g,e}of cards){g.clearRect(0,0,400,330);const phase=time%4;e.state=phase>2?'windup':'idle';e.moving=phase<1.7;e.walkDistance=time*55;const project=(x,y)=>({x:155+(x-y)*.36,y:220+(x+y)*.18});if(phase>3)drawMonsterAttack(g,{zones:monsterZones(e),color:e.def.color,pattern:e.def.pattern,life:4-phase,max:1},project,.8,'auto',texture);else if(phase>2)drawMonsterZones(g,monsterZones(e),project,.8,e.def.color,phase>3?.4:.13);g.fillStyle='#0006';g.beginPath();g.ellipse(155,220,55,15,0,0,7);g.fill();drawForestMonster(g,im,e,155,220,160,time,detail);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
