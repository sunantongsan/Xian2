<!doctype html><html lang="th"><meta charset="utf-8"><style>body{margin:0;background:#e7c58e}canvas{display:block}aside{position:absolute;top:18px;left:22px;font:18px sans-serif;color:#674a30;background:#fff5dfdf;border-radius:12px;padding:12px 18px}</style><canvas width="1280" height="800"></canvas><aside>เมืองโอเอซิส • เมือง 2<br><small>เมืองเล็ก · เดินต่อไปเขตล่าได้</small></aside><script type="module">
import {parseTiled} from './tilemap.js';import {createStarRenderer,drawGate} from './star-render.js';
const scene=parseTiled(await(await fetch('maps/hero-star.json')).json()),im=new Image();im.src='maps/star/oasis-buildings.webp';await im.decode();const images=new Map([['maps/star/oasis-buildings.webp',im]]),r=createStarRenderer(scene,{images}),cv=document.querySelector('canvas'),g=cv.getContext('2d');const scale=.78,view={w:1280,h:800,scale,ox:640-.8*(scene.spawn.x-scene.spawn.y)*scale,oy:420-.4*(scene.spawn.x+scene.spawn.y)*scale};
const times=[];for(let n=0;n<100;n++){const start=performance.now();const missing=r.drawGround(g,view),out=[];r.props(view,out,g);for(const p of scene.pois){if(Math.hypot(p.world.x-scene.spawn.x,p.world.y-scene.spawn.y)>800)continue;const x=view.ox+.8*(p.world.x-p.world.y)*scale,y=view.oy+.4*(p.world.x+p.world.y)*scale;out.push({sort:p.world.x+p.world.y,fn:()=>{drawGate(g,x,y,scale,0,{landmark:true,home:p.action==='warp'&&p.zone===0,town:p.action==='town',direction:p.action==='hunt'?-1:1});g.font='bold 14px sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#fff4d8';g.strokeText(p.name,x,y+22);g.fillStyle='#624325';g.fillText(p.name,x,y+22);}});}out.sort((a,b)=>a.sort-b.sort).forEach(o=>o.fn());times.push(performance.now()-start);if(!missing&&n>70)break;await new Promise(requestAnimationFrame);}window.qa={chunks:r.chunkCount(),frames:times.length,maxMs:Math.max(...times),steadyMs:times.slice(-10).reduce((a,b)=>a+b)/10};window.ready=true;
</script></html>
