name: Deploy tested coin recipient server
on:
  push:
    branches: [feature/coin-recipient-celebration]
    paths: ['.github/workflows/coin-recipient-deploy.yml']
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coin-recipient-server
          run-id: 42178043118
          github-token: ${{ github.token }}
          path: recipient-production
      - name: Install verified bundle with drift guard and rollback
        shell: bash
        run: |
          set -euo pipefail
          cd recipient-production
          sha256sum --check bundle.sha256
          test "$(sha256sum /opt/cockro-online/online-server.cjs | cut -d ' ' -f 1)" = c87e67e009e0e6f94ed5771b236dccc99e9d03c662f1e0e275408bee69e0dcb1
          systemctl show cockro-online.service --property=Environment --value | grep -q 'COCKRO_PLAY_RELAY_CONFIG=/etc/cockro-play-relay.json'
          /opt/cockro-online/node --check server/online-server.cjs
          grep -q billingRecipients server/online-server.cjs
          mkdir -p /srv/cockro-deploy/online-stage
          cp /opt/cockro-online/online-server.cjs /srv/cockro-deploy/online-stage/coin-recipient-before.cjs
          cp server/online-server.cjs /srv/cockro-deploy/online-stage/online-server.cjs
          candidate=$(sha256sum server/online-server.cjs | cut -d ' ' -f 1)
          rollback() {
            cp /srv/cockro-deploy/online-stage/coin-recipient-before.cjs /srv/cockro-deploy/online-stage/online-server.cjs
            sudo -n /usr/local/sbin/cockro-deploy-online c87e67e009e0e6f94ed5771b236dccc99e9d03c662f1e0e275408bee69e0dcb1
          }
          trap rollback ERR
          sudo -n /usr/local/sbin/cockro-deploy-online "$candidate"
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(15):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8091/online/health',timeout=3) as r: h=json.load(r)
                  if h.get('ok') and h.get('release')=='4.45.0':
                      print('HEALTH_OK',h['release'])
                      break
              except Exception: pass
              time.sleep(1)
          else: raise SystemExit('Health check failed')
          PY
          systemctl is-active cockro-online.service
          sha256sum /opt/cockro-online/online-server.cjs
          trap - ERR
