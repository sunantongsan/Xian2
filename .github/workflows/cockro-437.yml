name: Verify COCKRO 4.37 HUD chat and vault
on:
  push:
    branches: [cockro/4.37-hud-chat-vault, cockro/sideline-hud]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run check && npm run build:server
      - run: python3 tools/build_update_feed.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tools/review-437.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cockro-4.37-reviewed-patch-and-server
          path: |
            patch-public/latest.json
            patch-public/patches/*.zip
            server/online-server.cjs
            review/cockro-437-*.png
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug
