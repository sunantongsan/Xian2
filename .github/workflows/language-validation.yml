name: Thai-English language validation
on:
  push:
    branches: [feature/th-en-account-language]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test && npm run check
      - run: npm run build:server
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/review-language.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-phone-review
          path: review/language-*.png
      - run: python3 tools/build_update_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: cockro-4460-language-patch-server
          path: |
            patch-public/latest.json
            patch-public/patches/*.zip
            server/online-server.cjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: COCKRO-4.46.0-114-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
