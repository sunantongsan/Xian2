name: Thai-English language validation
on:
  push:
    branches: [feature/th-en-account-language]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test && npm run check
      - run: npm run build:server
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/review-language.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-phone-review
          path: review/language-*.png
