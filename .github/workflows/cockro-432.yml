name: Verify COCKRO 4.36 resumable updates
on:
  push:
    branches: [cockro/4.34-mobile-shops-pets]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run check && npm run build:server
      - run: python3 tools/validate_assets.py && python3 tools/build_update_feed.py
      - name: Review phone UI
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium --only-shell
          node tools/review-432.mjs
          node tools/review-commerce.mjs
          node tools/review-chat.mjs
          node tools/review-startup.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: COCKRO-112-candidate-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            patch-public/latest.json
            patch-public/patches/*.zip
            server/online-server.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: COCKRO-112-validation
          path: |
            review/*.png
            app/build/reports/tests
            app/build/reports/lint-results-debug.html

