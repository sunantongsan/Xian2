name: COCKRO verified game patch 90
on:
  push:
    branches: [cockro/2d-app-86]
    paths: ['web/**', 'tests/**', 'tools/**', '.github/workflows/cockro-patch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check && python3 tools/validate_assets.py
      - name: Verify browser gameplay
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/browser-smoke.mjs
          node tools/review-large-world.mjs
      - name: Package and verify every patch entry
        run: |
          python3 tools/package_patch.py
          python3 - <<'PY'
          import hashlib,json,zipfile
          with zipfile.ZipFile('Cockro-patch-4.5.0.zip') as z:
              m=json.loads(z.read('patch.json'))
              assert m['game']=='cockro' and m['engine']==88 and m['version']=='4.5.0'
              assert set(z.namelist())==set(m['files'])|{'patch.json'}
              for name,expected in m['files'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==expected,name
              assert 'combat-vfx.js' in m['files']
          PY
          sha256sum Cockro-patch-4.5.0.zip > SHA256SUMS.txt
      - name: Publish verified save-preserving game patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "cockro-patch-90-${GITHUB_RUN_NUMBER}" --target "$GITHUB_SHA" --prerelease --title 'COCKRO 90 — expanded hunting world patch' --notes 'For manual import into the existing Cockro preview engine 88/89. Keeps local saves; no APK reinstall needed. 54 connected clearings, 162 hunting packs, minimap, trail signs and improved area skills. Node tests, browser gameplay and every ZIP entry verified. Reuses existing terrain artwork; one playable hero; offline. Physical Android performance remains untested. No APK upgrade is included because the original preview signing key is currently unavailable.' Cockro-patch-4.5.0.zip SHA256SUMS.txt
