name: Rewarded ads Android validation
on:
  push:
    branches: [cockro/balance-gold-mp]
    paths:
      - 'app/**'
      - '.github/workflows/ads-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm test && npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Ensure release rejects missing real ad IDs
        env:
          ADMOB_APP_ID: ''
          ADMOB_REWARDED_UNIT_ID: ''
        run: |
          if gradle --no-daemon :app:validateProductionAds; then
            echo 'ERROR: production configuration guard failed'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Cockro-94-ads-test-only
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

