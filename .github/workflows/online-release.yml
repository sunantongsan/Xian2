name: COCKRO Online Release
run-name: Online ${{ inputs.operation }} by @${{ github.actor }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/online-release.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Reviewed online release operation
        default: stage
        required: true
        options: [stage, deploy, test]
permissions:
  contents: read
  actions: read
concurrency:
  group: cockro-online-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor == 'sunantongsan'
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d876b76834a7a6d3a68a1b43dd8acb163fad5e75
          persist-credentials: false
      - name: Download verified build from the pinned validation run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cockro-4444-server
          run-id: 42140701254
          github-token: ${{ github.token }}
          path: verified
      - name: Check verified server bundle
        run: |
          echo '600b52c2ea93fa64ad97715cf052c6562116be72484eae2708df8cad7a9c5149  verified/online-server.cjs' | sha256sum --check
          echo 'f3595df72da33b1be8e01b9caa53cb7dd41d487d35da5c13c5b79e4fc6d1b56c  verified/smoke.cjs' | sha256sum --check
          cp verified/online-server.cjs server/online-server.cjs
          cp verified/smoke.cjs server/smoke.cjs
      - name: Stage reviewed release
        run: |
          set -euo pipefail
          mkdir -p /srv/cockro-deploy/online-stage
          cp server/online-server.cjs server/bootstrap.py /srv/cockro-deploy/online-stage/
          sha256sum /srv/cockro-deploy/online-stage/online-server.cjs /srv/cockro-deploy/online-stage/bootstrap.py
          for candidate in /opt/cockro-runner/externals/node24/bin/node /opt/cockro-runner/externals/node20/bin/node; do
            if [ -x "$candidate" ]; then
              echo "ONLINE_NODE=$candidate" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Verify advanced world data and combat
        run: |
          "$ONLINE_NODE" --test tests/advanced-world.test.js tests/hero-star.test.js tests/fashion.test.js tests/balance.test.js tests/core.test.js tests/progression.test.js tests/skills.test.js tests/gear.test.js tests/upgrade-items.test.js tests/checkin.test.js tests/enhancement.test.js tests/release-backup.test.js tests/account-roads.test.js tests/account-management.test.js tests/living-forest.test.js tests/alien-world.test.js tests/maps.test.js tests/expedition.test.js tests/pvp-loot.test.js tests/pvp-timing.test.js tests/pvp-skills.test.js tests/merchant-session.test.js tests/render-performance.test.js tests/auto-hunt.test.js tests/shop-billing.test.js tests/commerce.test.js tests/identity-cleanup.test.js tests/loot-pets.test.js tests/chat.test.js tests/roamers.test.js tests/vault-pin.test.js tests/job-progression.test.js tests/balance-v3.test.js tests/mutation-combat.test.js tests/manual-mutation.test.js
      - name: Validate server bundle syntax
        run: '"$ONLINE_NODE" --check server/online-server.cjs'
      - name: Deploy fixed online service
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          digest="$(sha256sum server/online-server.cjs | cut -d ' ' -f 1)"
          sudo -n /usr/local/sbin/cockro-deploy-online "$digest"
      - name: Verify production registration gate
        if: github.event_name == 'push' || inputs.operation != 'stage'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 https://game.guardscan.xyz/online/health
          curl --fail --silent https://game.guardscan.xyz/online/health | "$ONLINE_NODE" -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=JSON.parse(s);if(!h.ok||h.release!=="4.44.4")process.exit(1);console.log("Verified backend 4.44.4 and pre-migration backup completed");});'
          "$ONLINE_NODE" server/smoke.cjs
      - name: Verify SSV route rejects unsigned callbacks
        if: github.event_name == 'push' || inputs.operation != 'stage'
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://game.guardscan.xyz/online/ads/ssv?invalid=1')"
          test "$code" = 400
