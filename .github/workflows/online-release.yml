name: COCKRO Online Release
run-name: Online ${{ inputs.operation }} by @${{ github.actor }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/online-release.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Reviewed online release operation
        default: stage
        required: true
        options: [stage, deploy, test]
permissions:
  contents: read
concurrency:
  group: cockro-online-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor == 'sunantongsan'
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 74f192b22b5bec2d134b94786cd6feb01cd4f70c
          persist-credentials: false
      - name: Stage reviewed release
        run: |
          set -euo pipefail
          mkdir -p /srv/cockro-deploy/online-stage
          cp server/online-server.cjs server/bootstrap.py /srv/cockro-deploy/online-stage/
          sha256sum /srv/cockro-deploy/online-stage/online-server.cjs /srv/cockro-deploy/online-stage/bootstrap.py
          for candidate in /opt/cockro-runner/externals/node24/bin/node /opt/cockro-runner/externals/node20/bin/node; do
            if [ -x "$candidate" ]; then
              echo "ONLINE_NODE=$candidate" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Verify advanced world data and combat
        run: |
          "$ONLINE_NODE" --test tests/advanced-world.test.js tests/hero-star.test.js tests/fashion.test.js tests/balance.test.js tests/core.test.js tests/progression.test.js tests/skills.test.js tests/gear.test.js tests/upgrade-items.test.js tests/checkin.test.js tests/enhancement.test.js tests/release-backup.test.js
      - name: Validate server bundle syntax
        run: '"$ONLINE_NODE" --check server/online-server.cjs'
      - name: Deploy fixed online service
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          digest="$(sha256sum server/online-server.cjs | cut -d ' ' -f 1)"
          sudo -n /usr/local/sbin/cockro-deploy-online "$digest"
      - name: Test live world using two players
        if: github.event_name == 'push' || inputs.operation != 'stage'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 https://game.guardscan.xyz/online/health
          curl --fail --silent https://game.guardscan.xyz/online/health | "$ONLINE_NODE" -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=JSON.parse(s);if(!h.ok||h.release!=="4.19.0")process.exit(1);console.log("Verified backend 4.19.0 and pre-migration backup completed");});'
          "$ONLINE_NODE" server/smoke.cjs
      - name: Verify SSV route rejects unsigned callbacks
        if: github.event_name == 'push' || inputs.operation != 'stage'
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://game.guardscan.xyz/online/ads/ssv?invalid=1')"
          test "$code" = 400
