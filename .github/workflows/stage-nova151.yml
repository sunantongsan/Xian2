name: Stage Nova patch 151 on existing VPS
on:
  push:
    branches: [codex/stage-nova151]
    paths: [.github/workflows/stage-nova151.yml]
permissions: {}
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 4
    steps:
      - name: Download and verify the reviewed Nova artifact only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib
          p=pathlib.Path("/srv/cockro-deploy")
          b=urllib.request.urlopen("https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-407c-8211-92f5-36ff5192376c/raw?se=2026-11-07T08%3A15%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=1f62361c-613a-90de-9678-bc007a7a6680&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T04%3A39%3A49Z&ske=2026-11-08T04%3A39%3A49Z&sks=b&skv=2026-02-06&sig=uAN2vvjXLLdjaUNRPsnOvAHILy7wsx6LcvBI6dUpno4%3D",timeout=90).read()
          assert hashlib.sha256(b).hexdigest()=="0c63a14964679deceae768628ef74d25a61c8003213a40ed94bf6e31bd0e9d49"
          (p/"nova151.zip").write_bytes(b)
          (p/"nova151.py").write_text("import urllib.request,hashlib,zipfile,io,json,pathlib,os,shutil,time\nraw=pathlib.Path(\"/srv/cockro-deploy/nova151.zip\").read_bytes()\nassert hashlib.sha256(raw).hexdigest()==\"0c63a14964679deceae768628ef74d25a61c8003213a40ed94bf6e31bd0e9d49\"\nz=zipfile.ZipFile(io.BytesIO(raw))\nmanifests={}\nfor v in range(19,39):\n p=\"patches/test/native-\"+str(v)+\"/manifest.json\"\n b=z.read(p);m=json.loads(b)\n assert m[\"contentVersion\"]==151 and m[\"nativeVersion\"]==v and len(m[\"files\"])==48\n ident=m.pop(\"id\")\n assert hashlib.sha256(json.dumps(m,ensure_ascii=False,separators=(\",\",\":\")).encode()).hexdigest()==ident\n manifests[p]=b\nfor f in m[\"files\"]:\n b=z.read(\"objects/\"+f[\"sha256\"])\n assert len(b)==f[\"size\"] and hashlib.sha256(b).hexdigest()==f[\"sha256\"]\nroot=pathlib.Path(\"/srv/nova-patches\")\nbackup=pathlib.Path(\"/srv/nova-patches-backups\")/(\"before151-\"+str(int(time.time())))\nshutil.copytree(root/\"patches\",backup)\ndef put(p,b):\n dst=root/p;dst.parent.mkdir(parents=True,exist_ok=True)\n tmp=dst.with_name(dst.name+\".151tmp\")\n tmp.write_bytes(b);os.replace(tmp,dst)\nfor f in m[\"files\"]:put(\"objects/\"+f[\"sha256\"],z.read(\"objects/\"+f[\"sha256\"]))\nfor p,b in manifests.items():put(p,b)\nprint(\"NOVA151_READY: 48 verified objects; 20 manifests; backup\",backup,flush=True)\n\n")
          print("NOVA151_STAGED",len(b))
          
          PY
