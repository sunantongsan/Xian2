name: Validate progression candidate
on:
  push:
    branches: [cockro/progression-20-60]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: progression-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test && npm run check && npm run build:server
      - run: npx esbuild server/smoke.js --bundle --platform=node --format=cjs --external:bufferutil --external:utf-8-validate --outfile=server/smoke.cjs
      - run: python3 tools/build_update_feed.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tools/review-437.mjs && node tools/review-mutations.mjs && node tools/review-439.mjs && node tools/review-440.mjs && node tools/review-character-draft.mjs && node tools/review-442.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cockro-442-verified
          path: |
            patch-public/
            server/online-server.cjs
            server/smoke.cjs
            server/bootstrap.py
            review/cockro-437-*.png
            review/mutation-browser.*
            review/cockro439-*.png
            review/cockro440-*.png
            review/character-redesign-review.png
            review/cockro442-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: cockro-442-server
          path: |
            server/online-server.cjs
            server/smoke.cjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cockro-442-android-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/tests
            app/build/reports/lint-results-debug.html

