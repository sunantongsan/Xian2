name: Inspect current COCKRO VPS release
on:
  push:
    branches: [fix/red-cockro-floating-joystick-20261120]
    paths: ['.github/workflows/cockro-712-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 2
    steps:
      - name: Read service status and existing deployment contract
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active cockro-online.service
          sha256sum /opt/cockro-online/online-server.cjs
          cat /usr/local/sbin/cockro-deploy-online
          cat /usr/local/sbin/cockro-control
          test -r /var/lib/cockro-online && echo SAVE_DIRECTORY_READABLE
          test -w /srv/cockro-deploy/online-stage && echo STAGING_WRITABLE
          curl --fail --silent --max-time 5 http://127.0.0.1:8091/online/health
