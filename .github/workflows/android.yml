name: COCKRO 2.5D Android 90
on:
  # Manual until the original preview signing key is restored.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check && python3 tools/validate_assets.py
      - name: Browser smoke test at mobile viewport
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/browser-smoke.mjs
          node tools/review-large-world.mjs
      - name: Retain rendered review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/large-world-preview.json
          git commit -m "Record rendered large-world review [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Attach UI test screenshots
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-browser-review
          path: review/browser
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        id: preview-signing
        with:
          path: ~/.android/debug.keystore
          key: cockro-2d-preview-signing-v1
      - name: Require existing preview signing key
        run: test '${{ steps.preview-signing.outputs.cache-hit }}' = 'true'
      - run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease :app:lintDebug || { cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }
      - name: Verify packaged assets and APK signature
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              names=set(z.namelist())
              for p in ['heroes/cockro.webp','index.html','game.js','skills.js','vfx/sword.webp','vfx/demon.webp','hero-animation.js','assets/MOTION-LICENSE.txt','maps.js','maps/aurora-outpost.webp','maps/biolume-tile.webp','sprites/alien-forest.webp','alien-population.js','combat-vfx.js']+[f'heroes/{h}-{state}.webp' for h in ['sword-male','sword-female','demon-male','demon-female'] for state in ['walk','actions']]:
                  assert 'assets/'+p in names,p
              assert not any(n.startswith(('assets/puppets/','assets/rig/')) for n in names)
              assert not any(n.endswith('.png') and n.startswith('assets/') for n in names)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Cockro-90-preview.apk
          cp app/build/outputs/bundle/release/app-release.aab Cockro-90-unsigned.aab
          python3 tools/package_patch.py
          sha256sum Cockro-90-preview.apk Cockro-90-unsigned.aab Cockro-patch-4.5.0.zip > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Cockro-90-preview.apk | head -1 | tee package.txt
          grep "com.sunantongsan.networkcokcro.preview" package.txt
          grep "versionCode='90'" package.txt
      - name: Verify upgrade signing compatibility with version 89
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-apk
          gh release download cockro-89-25 --pattern Cockro-89-preview.apk --dir previous-apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs previous-apk/Cockro-89-preview.apk | grep 'certificate SHA-256 digest' > previous-cert.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs Cockro-90-preview.apk | grep 'certificate SHA-256 digest' > current-cert.txt
          diff previous-cert.txt current-cert.txt
      - name: Attach downloadable APK and patch
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Cockro-90-APK-and-patch
          path: |
            Cockro-90-preview.apk
            Cockro-patch-4.5.0.zip
            SHA256SUMS.txt
          retention-days: 30
      - name: Publish downloadable test build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "cockro-90-${GITHUB_RUN_NUMBER}" --target "$GITHUB_SHA" --prerelease --title 'COCKRO 90 — Aurora alien world, levels 1–60' --notes 'New Aurora hero outpost and expanded alien forest for levels 1–60. Six connected regions, 972 regular monsters plus six bosses; 162 hunting packs across 54 clearings, warm-colored aliens and respawn. Old maps removed. Compatible ZIP patch for APK engine 88; local saves retained. Offline preview, automatic patch download and online play are not included. Character animation is still experimental. Unsigned AAB is not ready for Play upload.' Cockro-90-preview.apk Cockro-90-unsigned.aab Cockro-patch-4.5.0.zip SHA256SUMS.txt


