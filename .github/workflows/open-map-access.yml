name: Inspect COCKRO deploy helper
on:
  push:
    branches: [fix/mobile-layout-4.46.3]
    paths: ['.github/workflows/open-map-access.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 2
    steps:
      - name: Read existing deployment helper
        run: cat /usr/local/sbin/cockro-deploy-online
