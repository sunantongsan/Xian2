name: Stage Nova patch 150 on existing VPS
on:
  push:
    branches: [codex/stage-nova150]
    paths: [.github/workflows/stage-nova150.yml]
permissions: {}
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 4
    steps:
      - name: Download and verify the reviewed Nova artifact only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib
          p=pathlib.Path("/srv/cockro-deploy")
          b=urllib.request.urlopen("https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-ee54-8211-aa66-9751a7b1e919/raw?se=2026-11-07T07%3A40%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=3742c4d7-aca7-4e4c-a6cd-374edac72302&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A22%3A43Z&ske=2026-11-08T00%3A22%3A43Z&sks=b&skv=2026-02-06&sig=yLq8Q9%2BhnI/WQSK%2BQAUnzurhqQFdEbk51MUYP9FtgZg%3D",timeout=90).read()
          assert hashlib.sha256(b).hexdigest()=="ad54c45ac2b8cc66bb939eb63790f0258116f4e7899fcfccabac1ee5fa77981e"
          (p/"nova150.zip").write_bytes(b)
          (p/"nova150.py").write_text("import urllib.request,hashlib,zipfile,io,json,pathlib,os,shutil,time\nraw=pathlib.Path(\"/srv/cockro-deploy/nova150.zip\").read_bytes()\nassert hashlib.sha256(raw).hexdigest()==\"ad54c45ac2b8cc66bb939eb63790f0258116f4e7899fcfccabac1ee5fa77981e\"\nz=zipfile.ZipFile(io.BytesIO(raw))\nmanifests={}\nfor v in range(19,39):\n p=\"patches/test/native-\"+str(v)+\"/manifest.json\"\n b=z.read(p);m=json.loads(b)\n assert m[\"contentVersion\"]==150 and m[\"nativeVersion\"]==v and len(m[\"files\"])==48\n ident=m.pop(\"id\")\n assert hashlib.sha256(json.dumps(m,ensure_ascii=False,separators=(\",\",\":\")).encode()).hexdigest()==ident\n manifests[p]=b\nfor f in m[\"files\"]:\n b=z.read(\"objects/\"+f[\"sha256\"])\n assert len(b)==f[\"size\"] and hashlib.sha256(b).hexdigest()==f[\"sha256\"]\nroot=pathlib.Path(\"/srv/nova-patches\")\nbackup=pathlib.Path(\"/srv/nova-patches-backups\")/(\"before150-\"+str(int(time.time())))\nshutil.copytree(root/\"patches\",backup)\ndef put(p,b):\n dst=root/p;dst.parent.mkdir(parents=True,exist_ok=True)\n tmp=dst.with_name(dst.name+\".150tmp\")\n tmp.write_bytes(b);os.replace(tmp,dst)\nfor f in m[\"files\"]:put(\"objects/\"+f[\"sha256\"],z.read(\"objects/\"+f[\"sha256\"]))\nfor p,b in manifests.items():put(p,b)\nprint(\"NOVA150_READY: 48 verified objects; 20 manifests; backup\",backup,flush=True)\n\n")
          print("NOVA150_STAGED",len(b))
          
          PY
