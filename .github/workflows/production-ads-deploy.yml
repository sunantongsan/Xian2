name: Enable COCKRO production ads
on:
  push:
    branches: [fix/red-cockro-floating-joystick-20261120]
    paths: ['.github/workflows/production-ads-deploy.yml']
permissions: {contents: write}
concurrency:
  group: cockro-online-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Disable test rewards with guarded rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          old=6da0603d0a37f623abb5a006adfa27421796d2017d1edf875853a02534ff61e3
          new=322384530d32caa5a43d69666aa663d3267a349b8f180c01fa6c7b56cdba8667
          stage=/srv/cockro-deploy/online-stage/online-server.cjs
          backup=/srv/cockro-deploy/online-stage/pre-production-ads-20261121.cjs
          echo "$old  /opt/cockro-online/online-server.cjs" | sha256sum -c -
          cp /opt/cockro-online/online-server.cjs "$backup"
          python3 - <<'PY'
          import pathlib,hashlib
          b=pathlib.Path('/opt/cockro-online/online-server.cjs').read_bytes()
          old=b'testRewards:(process.env.COCKRO_TEST_REWARDS??String(admob_config_default.internalTestRewards||false))==="true"'
          assert b.count(old)==1
          b=b.replace(old,b'testRewards:false')
          assert hashlib.sha256(b).hexdigest()=='322384530d32caa5a43d69666aa663d3267a349b8f180c01fa6c7b56cdba8667'
          pathlib.Path('/srv/cockro-deploy/online-stage/online-server.cjs').write_bytes(b)
          PY
          /opt/cockro-online/node --check "$stage"
          rollback() { cp "$backup" "$stage"; sudo -n /usr/local/sbin/cockro-deploy-online "$old"; }
          trap rollback ERR
          sudo -n /usr/local/sbin/cockro-deploy-online "$new"
          curl --retry 5 --retry-connrefused --retry-delay 1 --fail --silent --max-time 5 http://127.0.0.1:8091/online/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] and h["release"]=="7.1.5"'
          echo "$new  /opt/cockro-online/online-server.cjs" | sha256sum -c -
          trap - ERR
          mkdir -p docs
          printf '{"testRewards":false,"release":"7.1.5","sha256":"%s"}\n' "$new" > docs/production-ads-deploy-result.json
      - name: Record verified deployment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/production-ads-deploy-result.json
          git commit -m 'Record verified production ads deployment [skip ci]'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
