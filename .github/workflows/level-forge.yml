name: Validate level and forge celebrations
on:
  push:
    branches: [feature/level-forge-celebrations]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test && npm run check && python3 tools/build_update_feed.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: |
          python3 -m http.server 8765 --directory web >/tmp/level-forge-http.log 2>&1 &
          node tools/review-level-forge.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: level-forge-review
          path: |
            /tmp/forge-success.png
            /tmp/forge-failure.png
            /tmp/level-effect.png
