name: Stage coin recipient release
on:
  push:
    branches: [feature/coin-recipient-celebration]
    paths: ['.github/workflows/coin-recipient-stage.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run build:server
          node --check server/online-server.cjs
          sha256sum server/online-server.cjs > bundle.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coin-recipient-server
          path: |
            server/online-server.cjs
            tools/coin-recipient-setup.py
            bundle.sha256
  stage:
    needs: build
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coin-recipient-server
          path: coin-recipient-verified
      - run: |
          set -euo pipefail
          cd coin-recipient-verified
          sha256sum --check bundle.sha256
          mkdir -p /srv/cockro-deploy/billing-stage
          cp server/online-server.cjs tools/coin-recipient-setup.py bundle.sha256 /srv/cockro-deploy/billing-stage/
          sha256sum /srv/cockro-deploy/billing-stage/coin-recipient-setup.py
