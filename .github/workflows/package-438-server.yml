name: Package verified COCKRO 4.38 server
on:
  push:
    branches: [cockro/progression-20-60]
    paths: [.github/workflows/package-438-server.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a190c611f229069a08acbeedcac56e8186b28aa4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build:server
      - run: npx esbuild server/smoke.js --bundle --platform=node --format=cjs --external:bufferutil --external:utf-8-validate --outfile=server/smoke.cjs
      - run: |
          echo '547581b1f32c3f1725b39de37b7879f3ff848ea5443c20d2e36956977f582501  server/online-server.cjs' | sha256sum --check
          echo '3611d2effc525a6beae3571b69c8ac1abc716bfc9955593bdf48fbf2daaf476a  server/smoke.cjs' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: cockro438-serveronly
          path: |
            server/online-server.cjs
            server/smoke.cjs
