name: Validate rewarded ad feedback
on:
  push:
    branches: [fix/ad-retry-no-cooldown]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test && npm run check && npm run build:server && python3 tools/build_update_feed.py

      - run: npx esbuild server/smoke.js --bundle --platform=node --format=cjs --external:bufferutil --external:utf-8-validate --outfile=server/smoke.cjs
      - run: sha256sum server/online-server.cjs server/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cockro-4444-server
          path: |
            server/online-server.cjs
            server/smoke.cjs
