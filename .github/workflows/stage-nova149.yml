name: Stage Nova patch 149 on existing VPS
on:
  push:
    branches: [codex/stage-nova149]
    paths: [.github/workflows/stage-nova149.yml]
permissions: {}
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 4
    steps:
      - name: Download and verify the reviewed Nova artifact only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib
          p=pathlib.Path("/srv/cockro-deploy")
          b=urllib.request.urlopen("https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8668-8211-a5fb-8c16ae892ae6/raw?se=2026-11-07T07%3A14%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=1f878432-779c-4c3b-a5d2-34c528e71f8f&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T04%3A30%3A36Z&ske=2026-11-08T04%3A30%3A36Z&sks=b&skv=2026-02-06&sig=opbYQchTyMQ260wE/WfnWkragyI%2BFWhDo0kg2bI2efs%3D",timeout=90).read()
          assert hashlib.sha256(b).hexdigest()=="c32dc3fb04c85e673dbce922b5294510ec901edc9268cbb3f596d8e04e80d8ae"
          (p/"nova149.zip").write_bytes(b)
          (p/"nova149.py").write_text("import urllib.request,hashlib,zipfile,io,json,pathlib,os,shutil,time\nraw=pathlib.Path(\"/srv/cockro-deploy/nova149.zip\").read_bytes()\nassert hashlib.sha256(raw).hexdigest()==\"c32dc3fb04c85e673dbce922b5294510ec901edc9268cbb3f596d8e04e80d8ae\"\nz=zipfile.ZipFile(io.BytesIO(raw))\nmanifests={}\nfor v in range(19,39):\n p=\"patches/test/native-\"+str(v)+\"/manifest.json\"\n b=z.read(p);m=json.loads(b)\n assert m[\"contentVersion\"]==149 and m[\"nativeVersion\"]==v and len(m[\"files\"])==48\n ident=m.pop(\"id\")\n assert hashlib.sha256(json.dumps(m,ensure_ascii=False,separators=(\",\",\":\")).encode()).hexdigest()==ident\n manifests[p]=b\nfor f in m[\"files\"]:\n b=z.read(\"objects/\"+f[\"sha256\"])\n assert len(b)==f[\"size\"] and hashlib.sha256(b).hexdigest()==f[\"sha256\"]\nroot=pathlib.Path(\"/srv/nova-patches\")\nbackup=pathlib.Path(\"/srv/nova-patches-backups\")/(\"before149-\"+str(int(time.time())))\nshutil.copytree(root/\"patches\",backup)\ndef put(p,b):\n dst=root/p;dst.parent.mkdir(parents=True,exist_ok=True)\n tmp=dst.with_name(dst.name+\".149tmp\")\n tmp.write_bytes(b);os.replace(tmp,dst)\nfor f in m[\"files\"]:put(\"objects/\"+f[\"sha256\"],z.read(\"objects/\"+f[\"sha256\"]))\nfor p,b in manifests.items():put(p,b)\nprint(\"NOVA149_READY: 48 verified objects; 20 manifests; backup\",backup,flush=True)\n\n")
          print("NOVA149_STAGED",len(b))
          
          PY
