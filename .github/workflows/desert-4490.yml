name: Deploy desert kingdom 4.49.0
on:
  push:
    branches: [feature/desert-kingdom-61-120]
    paths: ['.github/workflows/desert-4490.yml']
permissions:
  contents: read
concurrency:
  group: cockro-online-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, cockro-vps-control]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 81e4412f74134cd8f7e3998fe2835e6ed578eacd
          sparse-checkout: server
      - name: Deploy tested desert world with rollback
        shell: bash
        run: |
          set -euo pipefail
          candidate=a6b6dc36ee01bcfd11fb19c2a2c8c3f8b7068bd52dc6225750e2dcfee52d4e18
          before=2140675b89a5bdb842159a165ac1dd34e551b76cce5a7b2de0186aa12ab78a0b
          test "$(sha256sum server/online-server.cjs | cut -d ' ' -f 1)" = "$candidate"
          test "$(sha256sum /opt/cockro-online/online-server.cjs | cut -d ' ' -f 1)" = "$before"
          /opt/cockro-online/node --check server/online-server.cjs
          python3 - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://cockro-game-updates-k11vg6u1k-sunans-projects-4868df82.vercel.app/latest.json',timeout=20) as r: feed=json.load(r)
          assert feed['version']=='4.49.0' and feed['sha256']=='bdfa5aacca5a3a8c327709dbea0f7a52cbd936c8aa6e57e1a59c6efd0bf73427'
          with urllib.request.urlopen('http://127.0.0.1:8091/online/health',timeout=5) as r: h=json.load(r)
          assert h.get('ok') and h.get('release')=='4.48.4' and h.get('suitTypes')==10
          print('Verified staged client and current full-suit server')
          PY
          cp /opt/cockro-online/online-server.cjs /srv/cockro-deploy/online-stage/before-desert-4490.cjs
          test "$(sha256sum /srv/cockro-deploy/online-stage/before-desert-4490.cjs | cut -d ' ' -f 1)" = "$before"
          cp server/online-server.cjs /srv/cockro-deploy/online-stage/online-server.cjs
          rollback() {
            cp /srv/cockro-deploy/online-stage/before-desert-4490.cjs /srv/cockro-deploy/online-stage/online-server.cjs
            sudo -n /usr/local/sbin/cockro-deploy-online "$before"
          }
          trap rollback ERR
          sudo -n /usr/local/sbin/cockro-deploy-online "$candidate"
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8091/online/health',timeout=3) as r: h=json.load(r)
                  if h.get('ok') and h.get('release')=='4.49.0' and h.get('desertTiles')==384 and h.get('desertPopulation')==818 and h.get('suitTypes')==10:
                      print('DESERT_HEALTH_OK',h['release'],h['desertTiles'],h['desertPopulation'])
                      break
              except Exception: pass
              time.sleep(1)
          else: raise SystemExit('Health check failed')
          PY
          systemctl is-active cockro-online.service
          test "$(sha256sum /opt/cockro-online/online-server.cjs | cut -d ' ' -f 1)" = "$candidate"
          trap - ERR
