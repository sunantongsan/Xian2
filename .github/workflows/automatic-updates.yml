name: Verify COCKRO automatic updates 92
on:
  push:
    branches: [cockro/automatic-patches]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cockro-auto-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check && python3 tools/validate_assets.py && python3 tools/build_update_feed.py
      - name: Browser gameplay
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/browser-smoke.mjs
          node tools/review-large-world.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native tests and build
        env:
          COCKRO_LIVE_UPDATE_TEST: '1'
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease :app:lintDebug
      - name: Collect validation
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cockro-automatic-update-tests
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
            review/large-world-preview.json
      - name: Package unsigned app for original upload-key signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab Cockro-92-unsigned.aab
          sha256sum Cockro-92-unsigned.aab > SHA256SUMS.txt
          gh release create "cockro-auto-92-${GITHUB_RUN_NUMBER}" --target "$GITHUB_SHA" --prerelease --title 'COCKRO 92 welcome and automatic updater — unsigned native bundle' --notes 'Implements startup update checks, bounded HTTPS download, SHA-256 validation, atomic activation and rollback on failed boot. Requires one native app update. This AAB is unsigned and is not ready for Play upload or installation. Existing preview signing key remains unavailable; do not uninstall an existing preview to test. Node, browser, JVM recovery/download tests, Android build and lint passed.' Cockro-92-unsigned.aab SHA256SUMS.txt review/browser/welcome.png

