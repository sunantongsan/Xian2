plugins { id 'com.android.application' }
android {
    namespace 'com.sunantongsan.xian2'
    compileSdk 36
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { testLogging { exceptionFormat = "full"; events "passed", "failed"; showStandardStreams = true } } }
    defaultConfig {
        applicationId 'com.sunantongsan.networkcokcro'
        minSdk 26
        targetSdk 36
        versionCode 91
        versionName '4.6.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release }
    }
    sourceSets { main.assets.srcDirs = [rootProject.file('web')] }
}
dependencies { testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.webkit:webkit:1.14.0' }




