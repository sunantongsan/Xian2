plugins { id 'com.android.application' }
def adsConfig = new groovy.json.JsonSlurper().parse(rootProject.file('admob-config.json'))
def adsApp = providers.environmentVariable('ADMOB_APP_ID').orElse(adsConfig.appId).get()
def adsUnit = providers.environmentVariable('ADMOB_REWARDED_UNIT_ID').orElse(adsConfig.rewardedUnitId).get()
android {
    buildFeatures { buildConfig true }
    namespace 'com.sunantongsan.xian2'
    compileSdk 36
    buildToolsVersion "36.0.0"
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { testLogging { exceptionFormat = "full"; events "passed", "failed"; showStandardStreams = true } } }
    defaultConfig {
        applicationId 'com.sunantongsan.networkcokcro'
        minSdk 26
        targetSdk 36
        versionCode 95
        versionName '4.12.1'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.adstest'; versionNameSuffix '-adstest'
            manifestPlaceholders = [appLabel: 'COCKRO Ads Test', admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'ADMOB_REWARDED_UNIT_ID', '"ca-app-pub-3940256099942544/5224354917"'
        }
        release {
            manifestPlaceholders = [appLabel: 'COCKRO', admobAppId: adsApp]
            buildConfigField 'String', 'ADMOB_REWARDED_UNIT_ID', '"' + adsUnit + '"'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release }
    }
    sourceSets { main.assets.srcDirs = [rootProject.file('web')] }
}
dependencies {
 implementation 'com.google.android.gms:play-services-ads:25.5.0'
 implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.webkit:webkit:1.14.0' }

// Fail closed: a Store build must never ship sample IDs or missing account configuration.
tasks.register('validateProductionAds') {
 doLast {
  if (!(adsApp ==~ /ca-app-pub-\d{16}~\d{10}/) || !(adsUnit ==~ /ca-app-pub-\d{16}\/\d{10}/) || adsApp.contains('3940256099942544') || adsUnit.contains('3940256099942544')) {
   throw new GradleException('Set real ADMOB_APP_ID and ADMOB_REWARDED_UNIT_ID before building release.')
  }
 }
}
tasks.configureEach { if (name == 'preReleaseBuild') dependsOn 'validateProductionAds' }

