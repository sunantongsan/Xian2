plugins { id 'com.android.application' }
android {
    namespace 'com.sunantongsan.xian2'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sunantongsan.networkcokcro'
        minSdk 26
        targetSdk 36
        versionCode 86
        versionName '4.3.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release }
    }
    sourceSets { main.assets.srcDirs = [rootProject.file('web')] }
}
dependencies { implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.webkit:webkit:1.14.0' }


